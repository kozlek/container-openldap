version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot updates both the
  # pinned commit and the trailing "# vX.Y.Z" version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
